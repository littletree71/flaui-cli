# Calculator addition: 1 + 2 = 3
# Run: flaui-cli run samples/calculator.flow.yaml --doc out/calc-doc
# Note: Windows 11 Calculator is a UWP app. calc.exe exits immediately, so the window title must be given.
#       The title and display text below are the English values ("小算盤" / "顯示為 3" on Traditional Chinese Windows).
name: Calculator addition
app:
  launch: calc.exe
  window: Calculator
steps:
  - click: id=clearButton
    doc: Press C to clear the calculator
  - click: id=num1Button
    doc: Press 1
  - click: id=plusButton
    doc: Press +
  - click: id=num2Button
    doc: Press 2
  - click: id=equalButton
    doc: Press =
  - assert:
      target: id=CalculatorResults
      text: Display is 3
  - screenshot:
      filename: out/calculator-result.png
      highlight: id=CalculatorResults
